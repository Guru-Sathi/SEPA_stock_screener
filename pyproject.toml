[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcp-swing-screener"
version = "0.1.0"
description = "Serverless Minervini Trend & VCP Screener for Nifty 500"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "config*", "notifications*", "storage*"]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true